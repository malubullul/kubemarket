services:
  postgres:
    build:
      context: ./database
    image: malubullul/kubemarket-postgres:latest
    container_name: kubemarket-postgres
    environment:
      POSTGRES_DB: kubemarket
      POSTGRES_USER: kubemarket
      POSTGRES_PASSWORD: kubemarket_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubemarket -d kubemarket"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    image: malubullul/kubemarket-backend:latest
    container_name: kubemarket-backend
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://kubemarket:kubemarket_password@postgres:5432/kubemarket
      JWT_SECRET: local-compose-change-me
      JWT_EXPIRES_IN: 1d
      FRONTEND_ORIGIN: http://localhost:8080,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    image: malubullul/kubemarket-frontend:latest
    container_name: kubemarket-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres-data:
